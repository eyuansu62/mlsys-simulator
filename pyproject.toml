[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlsys-simulator"
dynamic = ["version"]
description = "CPU-only deterministic LLM serving simulation with explicit memory planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["llm", "inference", "simulation", "memory-planning", "mlsys"]
# The owner has deferred license selection. Add an SPDX license and LICENSE
# before publishing; an omitted license does not grant open-source permissions.
license-files = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
mlsys-sim = "mlsys_sim.cli:main"

[project.urls]
"Design plan" = "https://gist.github.com/eyuansu62/f91df8b7597801ca4fd91bb3bb8c98cc"

[tool.setuptools]
packages = ["mlsys_sim"]

[tool.setuptools.dynamic]
version = {attr = "mlsys_sim.__version__"}

[tool.setuptools.package-data]
mlsys_sim = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
